<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرم ثبت و محاسبه نمرات دانشجویان</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap');
        body { font-family: 'Vazirmatn', Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 650px; background: #fff; margin: 20px auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #34495e; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        .section-title { font-size: 16px; font-weight: bold; color: #2980b9; margin: 25px 0 15px; background: #e8f4f8; padding: 8px 12px; border-radius: 6px; }
        .result-box { background: #2ecc71; color: white; padding: 15px; border-radius: 8px; text-align: center; font-size: 18px; font-weight: bold; margin-top: 25px; }
        button { width: 100%; background-color: #3498db; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 20px; }
        button:disabled { background-color: #bdc3c7; }
        #statusMessage { text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>فرم محاسبه و ثبت نمرات دانشجویان</h2>
    <form id="gradingForm">
        <div class="form-group">
            <label for="studentName">نام و نام خانوادگی:</label>
            <input type="text" id="studentName" required>
        </div>
        <div class="form-group">
            <label for="studentId">شماره دانشجویی:</label>
            <input type="text" id="studentId" required>
        </div>
        <div class="form-group">
            <label for="mobile">شماره موبایل:</label>
            <input type="text" id="mobile" required placeholder="09123456789">
        </div>

        <div class="section-title">۱. اطلاعات علمی و حضور</div>
        <div class="form-group">
            <label for="virtualSessions">جلسات نهاد:</label>
            <input type="number" id="virtualSessions" value="0" oninput="calculateTotalScore()">
        </div>
        <div class="form-group">
            <label for="absences">تعداد غیبت‌ها:</label>
            <input type="number" id="absences" value="0" oninput="calculateTotalScore()">
        </div>

        <div class="section-title">۲. فعالیت‌های فرادرس و چالش</div>
        <div class="form-group">
            <label for="faradarsSessions">تعداد جلسات فرادرس:</label>
            <input type="number" id="faradarsSessions" value="0" oninput="calculateTotalScore()">
        </div>
        <div class="form-group">
            <label for="challengeCount">تعداد چالش‌نوردی:</label>
            <input type="number" id="challengeCount" value="0" oninput="calculateTotalScore()">
        </div>

        <div class="section-title">۳. سوالات تکمیلی</div>
        <div class="form-group">
            <label for="teachFaradars">آیا مایل به برگزاری فرادرس هستید؟</label>
            <select id="teachFaradars"><option>بله</option><option>خیر</option></select>
        </div>
        <div class="form-group">
            <label for="specialActivity">آیا فعالیت ویژه‌ای داشتید؟</label>
            <select id="specialActivity"><option>خیر</option><option>بله</option></select>
        </div>

        <div class="result-box">مجموع نمره: <span id="totalScore">0</span></div>
        <button type="submit" id="submitBtn">ثبت و ارسال به فایل اکسل</button>
        <div id="statusMessage"></div>
    </form>
</div>

<script>
    function calculateTotalScore() {
        let total = 0;
        const vS = parseInt(document.getElementById('virtualSessions').value) || 0;
        total += Math.min(vS * (3 / 14), 3);
        
        const abs = parseInt(document.getElementById('absences').value) || 0;
        total -= (abs * 0.25);
        
        const fS = parseInt(document.getElementById('faradarsSessions').value) || 0;
        total += (Math.floor(fS / 4) * 2) + ((fS % 4) * 0.25);
        
        const cC = parseInt(document.getElementById('challengeCount').value) || 0;
        total += (cC * 0.25);
        
        total = Math.max(0, Math.min(20, total));
        document.getElementById('totalScore').innerText = total.toFixed(2);
        return { total: total.toFixed(2), vS, abs, fS, cC };
    }

    document.getElementById('gradingForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = 'در حال ارسال...';
        
        const scores = calculateTotalScore();
        const scriptURL = 'لینک_گوگل_اسکریپت_خود_را_اینجا_قرار_دهید';
        
        let requestBody = new FormData();
        requestBody.append('studentName', document.getElementById('studentName').value);
        requestBody.append('studentId', document.getElementById('studentId').value);
        requestBody.append('mobile', document.getElementById('mobile').value);
        requestBody.append('virtualSessions', scores.vS);
        requestBody.append('absences', scores.abs);
        requestBody.append('faradarsSessions', scores.fS);
        requestBody.append('challengeCount', scores.cC);
        requestBody.append('teachFaradars', document.getElementById('teachFaradars').value);
        requestBody.append('specialActivity', document.getElementById('specialActivity').value);
        requestBody.append('totalScore', scores.total);
        requestBody.append('date', new Date().toLocaleString('fa-IR'));

        fetch(scriptURL, { method: 'POST', body: requestBody })
        .then(() => {
            alert('اطلاعات با موفقیت ثبت شد');
            document.getElementById('gradingForm').reset();
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = 'ثبت و ارسال به فایل اکسل';
        });
    });
</script>
</body>
</html>
